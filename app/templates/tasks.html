<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务记录 · 个人论文助手</title><link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/reading.css"></head>
<body><div class="research-shell">{% with active='tasks' %}{% include '_research_nav.html' %}{% endwith %}<main class="research-main"><header class="research-header"><div><h1>任务记录</h1><p>查看文献精读任务的执行状态，继续查看结果或重新发起失败任务。</p></div><div class="header-icons"><svg><use href="#i-search"/></svg><svg><use href="#i-bell"/></svg><svg><use href="#i-user"/></svg></div></header><div class="demo-ribbon">列表含 5 条标注为“模拟”的任务，不含真实处理结果。新建任务由本地 MySQL 保存并在两个页面同步显示。</div><section class="research-card records-card"><div class="records-summary"><div><strong id="all-count">0</strong><span>全部任务</span></div><div><strong id="done-count">0</strong><span>已完成</span></div><div><strong id="active-count">0</strong><span>排队 / 处理中</span></div><div><strong id="failed-count">0</strong><span>失败</span></div></div><div class="table-head"><h2>全部任务</h2><div><input id="task-search" placeholder="搜索论文标题、来源..." aria-label="搜索任务"><select id="task-status" aria-label="任务状态"><option value="all">全部状态</option><option value="queued">排队中</option><option value="processing">处理中</option><option value="completed">已完成</option><option value="failed">失败</option></select></div></div><div class="table-labels"><span>论文信息</span><span>来源</span><span>创建时间</span><span>状态</span><span>操作</span></div><div id="reading-tasks" class="task-list"></div><div class="table-footer"><span id="task-count">共 0 条</span><a href="/reading">新建精读任务 →</a></div></section></main></div><div id="toast" class="toast" role="status"></div><script src="/static/task_common.js" defer></script><script src="/static/tasks.js" defer></script></body></html>
