<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文献检索 · 个人论文助手</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/search.css?v={{ static_version }}">
</head>
<body>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 4h16v13H9l-5 3zM8 10h.01M12 10h.01M16 10h.01"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M5 2h10l4 4v16H5zM15 2v5h4M8 12h8M8 16h8"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 3v18M8 3v18M13 3l3 18M18 3l3 18"/></symbol>
    <symbol id="i-task" viewBox="0 0 24 24"><path d="M8 4H4v17h16V4h-4M9 3h6v4H9zM8 13l2 2 5-5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M10 2h4l1 3 2 1 3-1 2 4-2 2v2l2 2-2 4-3-1-2 1-1 3h-4l-1-3-2-1-3 1-2-4 2-2v-2L2 9l2-4 3 1 2-1z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5zM10 21h4"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="9" r="3"/><path d="M5 19a7 7 0 0 1 14 0"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M13 4h7v7M20 4l-9 9M19 14v6H4V5h6"/></symbol>
    <symbol id="i-quote" viewBox="0 0 24 24"><path d="M10 5C6 7 4 10 4 16h6v-6H7M20 5c-4 2-6 5-6 11h6v-6h-3"/></symbol>
  </svg>
  <div class="search-shell">
    <nav class="main-nav" aria-label="主导航">
      <div class="brand"><div class="drop small-drop"></div><strong>个人论文助手</strong></div>
      <div class="nav-items">
        <a class="nav-item" href="/"><svg><use href="#i-home"/></svg>首页</a>
        <a class="nav-item" href="/chat"><svg><use href="#i-chat"/></svg>AI对话</a>
        <a class="nav-item active" href="/search" aria-current="page"><svg><use href="#i-search"/></svg>文献检索</a>
        <a class="nav-item" href="/reading"><svg><use href="#i-file"/></svg>文献精读</a>
        <a class="nav-item" href="/library"><svg><use href="#i-library"/></svg>文献库</a>
        <a class="nav-item" href="/tasks"><svg><use href="#i-task"/></svg>任务记录</a>
        <a class="nav-item" href="/settings"><svg><use href="#i-settings"/></svg>设置</a>
      </div>
      <div class="profile"><div class="avatar">C</div><div><strong>Chelsea</strong><small>本地个人工作区</small></div><svg><use href="#i-down"/></svg></div>
    </nav>
    <script src="/static/profile.js" defer></script>
    <main class="search-main">
      <header class="search-header">
        <div><h1>文献检索</h1><p>输入关键词、时间范围等条件，检索相关文献，查看摘要与研究分析。</p></div>
        <div class="search-top-actions"><button data-coming="全局搜索" title="全局搜索"><svg><use href="#i-search"/></svg></button><button data-coming="通知" title="通知"><svg><use href="#i-bell"/></svg></button><button data-coming="个人中心" title="个人中心"><svg><use href="#i-user"/></svg></button></div>
      </header>
      <div class="mock-banner"><strong id="source-mode-title">数据来源说明</strong><span id="source-mode-text">优先检索 OpenAlex；结果不足或服务不可用时，由 SerpApi Google Scholar 补充。</span></div>
      <section class="search-card" aria-label="检索条件">
        <form id="search-form">
          <div class="query-label"><label for="query">研究主题 / 关键词 <em>*</em></label><span id="query-count">0/200</span></div>
          <input id="query" name="query" maxlength="200" value="数字金融与制造业高质量发展" placeholder="例如：数字金融与制造业高质量发展" required>
          <div class="filter-grid">
            <div class="filter-field source-field"><label>文献类型</label><div class="source-controls" role="radiogroup" aria-label="文献类型"><label><input type="radio" name="language" value="zh" checked> 中文</label><label><input type="radio" name="language" value="en"> 英文</label></div></div>
            <div class="filter-field"><label>发表时间</label><div class="year-controls"><select id="year-from" aria-label="起始年份"></select><span>—</span><select id="year-to" aria-label="结束年份"></select></div></div>
            <div class="filter-field"><label for="count">需要抓取数量</label><select id="count"><option value="10">10 篇</option><option value="20" selected>20 篇</option><option value="30">30 篇</option><option value="50">50 篇</option><option value="100">100 篇</option></select></div>
            <div class="filter-field"><label for="sort">排序方式</label><select id="sort"><option value="relevance">相关度（高到低）</option><option value="year_desc">发表时间（从晚到早）</option><option value="year_asc">发表时间（从早到晚）</option></select></div>
            <button id="search-button" class="primary-button" type="submit"><svg><use href="#i-search"/></svg>开始检索</button>
          </div>
        </form>
      </section>
      <section class="results-card" aria-label="检索结果">
        <div class="results-heading"><div><h2>检索结果 <small id="result-count">（0 篇）</small></h2><p id="result-summary">输入条件并开始检索</p></div><span class="result-sort-note" id="sort-note"></span></div>
        <div class="results-toolbar"><label class="select-all"><input type="checkbox" id="select-all"> 本页全选</label><span id="selected-count">已选择 0 篇</span><button id="zotero-button" class="secondary-button" type="button" disabled title="请先在设置中连接 Zotero">导入 Zotero</button><button id="archive-button" class="secondary-button" type="button" disabled>导入文献库</button><button id="reading-button" class="secondary-button" type="button" disabled title="选择一篇文献开始精读">精读文献</button><input id="filter-results" placeholder="在结果中搜索标题或关键词..." aria-label="在结果中搜索"></div>
        <div id="results" class="results-list" aria-live="polite"></div>
        <nav id="results-pagination" class="results-pagination" aria-label="检索结果分页"></nav>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <dialog id="import-dialog" class="import-dialog" aria-labelledby="import-title"><form id="import-form" method="dialog"><div class="import-head"><h2 id="import-title">导入主题文献库</h2><button id="import-close" type="button" aria-label="关闭">×</button></div><p id="import-summary"></p><div class="import-tabs"><button type="button" data-import-tab="existing" class="active">已有主题</button><button type="button" data-import-tab="new">＋ 新建主题</button></div><div id="existing-topics" class="existing-topics"></div><div id="new-topic" class="new-topic" hidden><label for="new-topic-name">主题名称</label><input id="new-topic-name" maxlength="100" placeholder="例如：数字金融与制造业"></div><p id="import-error" class="import-error" role="alert"></p><div class="import-actions"><button id="import-cancel" type="button">取消</button><button id="import-confirm" type="submit">确认导入</button></div></form></dialog>
  <script src="/static/search.js?v={{ static_version }}" defer></script>
</body>
</html>
