<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文献精读 · 个人论文助手</title><link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/reading.css"></head>
<body><div class="research-shell">{% with active='reading' %}{% include '_research_nav.html' %}{% endwith %}<main class="research-main">
<header class="research-header"><div><h1>文献精读</h1><p>获取论文原文，为英文论文生成中文版 PDF，并按模板生成中文阅读报告。</p></div><div class="header-icons"><svg><use href="#i-search"/></svg><svg><use href="#i-bell"/></svg><svg><use href="#i-user"/></svg></div></header>
<div class="demo-ribbon">列表含 5 条模拟任务，仅用于展示。DOI 先查 OpenAlex，再由 SerpApi 兜底；英文论文生成中文版 PDF，中文论文直接生成报告。</div>
<div class="reading-grid"><div class="reading-left">
<section class="research-card submit-card"><div class="input-tabs"><button id="doi-tab" class="active" type="button"><svg><use href="#i-link"/></svg> DOI / 链接</button><button id="file-tab" type="button"><svg><use href="#i-upload"/></svg> 文件上传</button></div><form id="reading-form"><div class="input-line"><input id="doi-input" placeholder="请输入 DOI、arXiv 链接或直接 PDF 链接" aria-label="DOI 或论文链接"><div id="upload-zone" hidden><input id="pdf-input" type="file" accept="application/pdf,.pdf"><span id="file-name">选择 PDF 文件（最大 10 MB）</span></div><button type="submit" class="blue-button">开始精读</button></div></form><p id="template-required" class="form-error" hidden>开始精读前，请先在<a href="/settings">设置中上传阅读报告模板</a>。</p><p id="form-error" class="form-error" role="alert"></p></section>
<section class="research-card task-table-card"><div class="table-head"><h2>精读任务记录</h2><div><input id="task-search" placeholder="搜索论文标题、来源..." aria-label="搜索任务"><select id="task-status" aria-label="任务状态"><option value="all">全部状态</option><option value="queued">排队中</option><option value="processing">处理中</option><option value="completed">已完成</option><option value="failed">失败</option></select></div></div><div class="table-labels"><span>论文信息</span><span>来源</span><span>创建时间</span><span>状态</span><span>操作</span></div><div id="reading-tasks" class="task-list"></div><div class="table-footer"><span id="task-count">共 0 条</span><a href="/tasks">查看全部任务 →</a></div></section>
</div><aside class="research-card result-card"><div class="result-head"><h2>精读结果</h2><span id="result-task-label"></span></div><div class="result-tabs"><button type="button" class="active" data-result-tab="original">原文 PDF</button><button type="button" data-result-tab="translation">中文翻译</button><button type="button" data-result-tab="report">阅读报告</button></div><div class="reading-export"><button id="reading-zotero" type="button" hidden>归档至 Zotero 每周精读文献</button></div><div id="result-content" class="result-content"><div class="result-placeholder">选择一条任务查看精读结果</div></div></aside></div>
</main></div><div id="toast" class="toast" role="status"></div><script src="/static/task_common.js" defer></script><script src="/static/reading.js" defer></script></body></html>
