<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文献库 · 个人论文助手</title><link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/reading.css"><link rel="stylesheet" href="/static/library.css"></head>
<body><div class="research-shell">{% with active='library' %}{% include '_research_nav.html' %}{% endwith %}<main class="research-main library-main">
<header class="research-header"><div><h1>文献库</h1><p>管理你收藏和精读的所有文献，支持查看、检索与分类。</p></div><div class="header-icons"><svg><use href="#i-search"/></svg><svg><use href="#i-bell"/></svg><svg><use href="#i-user"/></svg></div></header>
<nav class="library-tabs" aria-label="文献库分类"><button class="active" data-category="all">全部文献</button><button data-category="reading">精读文献库</button><button data-category="theme">主题文献库</button></nav>
<section class="research-card library-workspace"><div class="library-controls"><label class="library-query-wrap"><svg><use href="#i-search"/></svg><input id="library-query" placeholder="搜索论文标题、作者、关键词..." aria-label="搜索文献"></label><button id="upload-open" class="blue-button" type="button">＋ 导入文献</button></div><div class="library-filter-row"><div id="topic-chips" class="topic-chips" hidden></div><select id="library-source" aria-label="筛选来源"><option value="all">全部来源</option><option value="OpenAlex">OpenAlex</option><option value="Google Scholar">Google Scholar</option><option value="CNKI">知网（历史记录）</option><option value="本地上传">本地上传</option><option value="DOI">DOI</option><option value="arXiv">arXiv</option></select><a href="/search">前往文献检索 →</a></div><div class="library-meta-row"><h2 id="library-heading">全部文献</h2><span id="library-count">0 篇</span></div>
<div class="library-layout"><div id="library-list" class="library-list" aria-live="polite"></div><aside class="library-detail"><div id="library-detail-content" class="library-detail-content"><div class="result-placeholder">选择一篇文献查看详情</div></div></aside></div></section>
</main></div><div id="toast" class="toast" role="status"></div>
<dialog id="upload-dialog" class="library-dialog" aria-labelledby="upload-title"><form id="upload-form"><div class="modal-head"><h2 id="upload-title">本地导入文献</h2><button type="button" id="upload-close" aria-label="关闭">×</button></div><p>上传原文 PDF；可选中文版 PDF。文献将保存在本地文献库。</p><div class="upload-fields"><label>保存位置<select name="category" id="upload-category"><option value="theme">主题文献库</option><option value="reading">精读文献库</option></select></label><div id="upload-topic-wrap"><label>所属主题<select name="topic_id" id="upload-topic"></select></label><button type="button" id="upload-create-topic">＋ 新建主题</button></div><label>论文标题<input name="title" maxlength="500" required placeholder="请输入论文标题"></label><label>作者<input name="authors" maxlength="500" placeholder="可选"></label><label>摘要<textarea name="abstract" maxlength="5000" rows="3" placeholder="可选，填写已知摘要"></textarea></label><div class="upload-pair"><label>DOI<input name="doi" maxlength="255" placeholder="可选，例如 10.1234/abc"></label><label>来源链接<input name="source_url" type="url" maxlength="2000" placeholder="可选，HTTPS 链接"></label></div><label>原文 PDF<input name="original" type="file" accept="application/pdf,.pdf" required></label><label>中文版 PDF（可选）<input name="chinese" type="file" accept="application/pdf,.pdf"></label></div><p id="upload-error" class="upload-error" role="alert"></p><div class="modal-actions"><button type="button" id="upload-cancel">取消</button><button type="submit" id="upload-submit">确认导入</button></div></form></dialog>
<dialog id="topic-dialog" class="topic-dialog" aria-labelledby="topic-title"><form id="topic-form"><h2 id="topic-title">新建文献主题</h2><label>主题名称<input id="topic-name" maxlength="100" required placeholder="例如：数字金融与制造业"></label><p id="topic-error" role="alert"></p><div class="modal-actions"><button type="button" id="topic-cancel">取消</button><button type="submit">创建主题</button></div></form></dialog>
<script src="/static/library.js" defer></script></body></html>
